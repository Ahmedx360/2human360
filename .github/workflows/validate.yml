name: Validate and build Too Human recompilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep only the newest validation for a given PR/ref. This prevents a backlog
# when several commits are pushed while a build is still queued or running.
concurrency:
  group: too-human-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate generated artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure validation build
        run: cmake -S . -B build/validate -DTH_BUILD_RECOMP_LIB=OFF -DBUILD_TESTING=ON

      - name: Build validation targets
        run: cmake --build build/validate --parallel

      - name: Validate generated PowerPC artifacts
        run: ctest --test-dir build/validate --output-on-failure

  build-generated-library:
    name: Compile generated PPC library and runtime adapter with Clang
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository and pinned toolchain
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build

      - name: Build the pinned XenonRecomp tools and verify the title patch
        run: python tools/recompile.py build-tools --generator Ninja --compiler clang++

      - name: Configure Clang build
        run: >-
          cmake -S . -B build/clang -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DTH_BUILD_RECOMP_LIB=ON
          -DTH_BUILD_RUNTIME_CORE=ON
          -DTH_BUILD_RUNTIME_PROBE=ON
          -DBUILD_TESTING=ON

      - name: Compile the recompiled game-code library
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/diagnostics
          cmake --build build/clang --target TooHumanRuntimeProbe TooHumanXexImportAudit TooHumanPpcImportRegistryTests TooHumanBootHleTests TooHumanGuestThreadStartupTests TooHumanGuestThreadManagerTests TooHumanGuestThreadRuntimeTests TooHumanGuestVfsTests TooHumanGuestKernelObjectTests TooHumanGuestMemoryTests TooHumanGuestHeapTests TooHumanXbox360PeTests TooHumanXexImageTests TooHumanPm4GuestRingTests TooHumanXenosCommandProcessorTests --parallel 1 2>&1 | tee build/diagnostics/clang-build.log

      - name: Preserve compiler failure diagnostics
        if: failure()
        shell: bash
        run: |
          if [[ -f build/diagnostics/clang-build.log ]]; then
            tail -n 250 build/diagnostics/clang-build.log | tee build/diagnostics/clang-build-failure-tail.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compiler failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: too-human-clang-build-failure
          path: build/diagnostics/clang-build-failure-tail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit the uploaded Too Human XEX
        if: ${{ hashFiles('Default.xex') != '' }}
        shell: bash
        run: |
          mkdir -p build/diagnostics
          sha256sum Default.xex Default.exe filetable.txt contents.zzz.gz | tee build/diagnostics/title-input-sha256.txt
          {
            echo "## contents.zzz.gz container check"
            gzip -t contents.zzz.gz
            gzip -l contents.zzz.gz
            echo "## filetable mapping availability"
            python3 - <<'PY'
          import csv
          from pathlib import Path
          rows = list(csv.reader(Path("filetable.txt").open(newline="", encoding="utf-8-sig")))
          rows = [row for row in rows if len(row) >= 2 and row[0] and row[1]]
          stored = sum(Path(row[0]).is_file() for row in rows)
          logical = sum(Path(row[1]).is_file() for row in rows)
          print(f"Mappings: {len(rows)}; stored-name files present: {stored}; logical-name files present: {logical}")
          PY
          } 2>&1 | tee build/diagnostics/title-content-layout.log
          ./build/clang/runtime/TooHumanXexImportAudit Default.xex 2>&1 | tee build/diagnostics/title-xex-audit.log

      - name: Attempt real title entry-point boot (diagnostic)
        if: ${{ hashFiles('Default.xex') != '' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          TH_TRACE_IMPORTS: "1"
          TH_TRACE_IMPORT_LIMIT: "10000"
          TH_BOOT_WATCHDOG_SECONDS: "110"
          TH_GAME_ROOT: ${{ github.workspace }}
          TH_SAVE_ROOT: ${{ runner.temp }}/too-human-save
        shell: bash
        run: |
          mkdir -p build/diagnostics "$TH_SAVE_ROOT"
          ulimit -c 0
          set +e
          timeout --signal=TERM --kill-after=5s 130s ./build/clang/runtime/TooHumanRuntimeProbe Default.xex --run > build/diagnostics/title-boot.log 2>&1
          result=$?
          echo "Runtime probe exit code: $result" | tee build/diagnostics/title-boot-exit.txt
          cat build/diagnostics/title-boot.log
          exit "$result"

      - name: Upload real-title boot diagnostics
        if: always() && hashFiles('build/diagnostics/title-*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: too-human-real-title-boot-diagnostics
          path: build/diagnostics/title-*
          if-no-files-found: ignore
          retention-days: 14

      - name: Test XEX import dispatch
        env:
          TH_TRACE_IMPORTS: "1"
        run: ctest --test-dir build/clang -R "TooHuman(BootHle|PpcImportRegistry|GuestThreadStartup|GuestThreadManager|GuestThreadRuntime|GuestVfs|GuestKernelObject|GuestMemory|GuestHeap|Xbox360Pe|XexImage|Pm4GuestRing|XenosCommandProcessor)Tests" --output-on-failure
