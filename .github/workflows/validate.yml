name: Validate recompilation metadata

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure validation build
        run: cmake -S . -B build/validate -DTH_BUILD_RECOMP_LIB=OFF -DBUILD_TESTING=ON

      - name: Validate generated PowerPC artifacts
        run: ctest --test-dir build/validate --output-on-failure
