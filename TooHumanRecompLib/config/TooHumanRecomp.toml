# Too Human (Xbox 360) - XenonRecomp configuration
# Image: PE, base 0x82000000, entry 0x82A46B18 (RVA 0xA46B18)
[main]
file_path = "../private/default.exe"
out_directory_path = "../ppc"
switch_table_file_path = "switch_tables.toml"

# Leave all optimizations OFF until a working build exists.
skip_lr = false
skip_msr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

# Compiler save/restore helpers (found via XenonRecomp README byte patterns)
restgprlr_14_address = 0x82A4EA20
savegprlr_14_address = 0x82A4E9D0
restfpr_14_address   = 0x82A6175C
savefpr_14_address   = 0x82A61710
restvmx_14_address   = 0x82EC4BD8
savevmx_14_address   = 0x82EC4940
restvmx_64_address   = 0x82EC4C6C
savevmx_64_address   = 0x82EC49D4

# setjmp/longjmp: not located yet (needs RtlUnwind import name) - TODO
# longjmp_address = 0x........
# setjmp_address  = 0x........

# Zero padding (e.g. first 0x5000 bytes of .text) must be skipped or analysis never advances
invalid_instructions = [
    { data = 0x00000000, size = 4 }, # Padding
]
